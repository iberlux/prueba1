services:
  db:
    image: postgres:16
    container_name: bikes_db
    environment:
      POSTGRES_DB: bikes_db
      POSTGRES_USER: bikes_user
      POSTGRES_PASSWORD: bikes_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bikes_user -d bikes_db']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: bikes_backend
    env_file:
      - ./backend/.env.example
    environment:
      POSTGRES_HOST: db
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
    container_name: bikes_frontend
    environment:
      NUXT_PUBLIC_API_BASE_INTERNAL: http://backend:8000/api
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
