services:
  db:
    image: postgres:16
    container_name: bikes_db
    environment:
      POSTGRES_DB: bikes_db
      POSTGRES_USER: bikes_user
      POSTGRES_PASSWORD: bikes_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: bikes_backend
    env_file:
      - ./backend/.env.example
    environment:
      POSTGRES_HOST: db
    depends_on:
      - db
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: bikes_frontend
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
